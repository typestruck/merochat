plugins { id 'com.android.application' version '8.9.1' }

android {
    namespace 'com.lynx.explorer'
    compileSdk 36
    defaultConfig {
        applicationId 'com.merochat.explorer'
        minSdk 24
        targetSdk 32
        versionCode 1
        versionName '4.0.3-merochat'
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ['room.schemaLocation': "$projectDir/schemas".toString()]
            }
        }
    }
    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets.main {
        manifest.srcFile 'build/upstream/AndroidManifest.xml'
        java.srcDirs += ['build/upstream/java']
        res.srcDirs += ['build/upstream/res']
        assets.srcDirs += ['build/upstream/assets']
    }
    packaging { jniLibs.pickFirsts += ['**/libc++_shared.so', '**/liblynx.so', '**/liblynxtrace.so', '**/libnapi.so'] }
}

dependencies {
    implementation platform("org.jetbrains.kotlin:kotlin-bom:1.8.22")
    implementation 'org.lynxsdk.lynx:serval_markdown:0.1.1'
    implementation 'org.lynxsdk.lynx:lynxtextra:0.1.1'
    ['lynx', 'lynx-base', 'lynx-devtool', 'lynx-service-log', 'lynx-service-image',
     'lynx-service-devtool', 'lynx-service-http', 'xelement', 'xelement-input',
     'xelement-overlay', 'xelement-viewpager', 'xelement-scroll-coordinator',
     'xelement-svg', 'xelement-markdown', 'xelement-refresh', 'xelement-blur-view',
     'xelement-webview'].each { implementation "org.lynxsdk.lynx:${it}:4.0.3" }
    annotationProcessor 'org.lynxsdk.lynx:lynx-processor:4.0.3'
    compileOnly 'org.lynxsdk.lynx:lynx-processor:4.0.3'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.room:room-runtime:2.8.4'
    annotationProcessor 'androidx.room:room-compiler:2.8.4'
    implementation 'com.facebook.fresco:fresco:2.3.0'
    implementation 'com.facebook.fresco:animated-gif:2.3.0'
    implementation 'com.facebook.fresco:animated-webp:2.3.0'
    implementation 'com.facebook.fresco:webpsupport:2.3.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.squareup.okhttp3:okhttp:4.9.0'
    implementation 'com.squareup.okhttp3:okhttp-urlconnection:4.4.0'
    implementation 'com.squareup.retrofit2:retrofit:2.7.0'
    implementation 'com.google.android.material:material:1.4.0'
}
